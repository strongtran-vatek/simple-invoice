# Starts the whole stack:  cp .env.example .env && docker compose up
# Every value comes from .env; nothing sensitive is written in this file.
name: simple-invoice

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is not set. Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env first}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set. Copy .env.example to .env first}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the Compose network the database is always db:5432.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKEND_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set. Copy .env.example to .env first}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is not set. Copy .env.example to .env first}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is not set. Copy .env.example to .env first}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db-data:
